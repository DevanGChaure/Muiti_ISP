frr version 10.7.0
frr defaults traditional
hostname Enterprise
log stdout
!
ip prefix-list ENT-NET seq 5 permit 10.10.0.0/16
!
route-map ENT-OUT permit 10
 match ip address prefix-list ENT-NET
!
router bgp 65010
 bgp router-id 10.0.0.2
 no bgp ebgp-requires-policy
 bgp log-neighbor-changes
 neighbor 10.0.0.1 remote-as 65001
 neighbor 10.0.1.1 remote-as 65002
 !
 address-family ipv4 unicast
  network 10.10.0.0/16
  neighbor 10.0.0.1 activate
  neighbor 10.0.0.1 route-map ENT-OUT out
  neighbor 10.0.1.1 activate
  neighbor 10.0.1.1 route-map ENT-OUT out
 exit-address-family
