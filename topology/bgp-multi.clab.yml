name: bgp-multi

topology:
  nodes:
    isp1:
      kind: linux
      image: quay.io/frrouting/frr:10.7.0
      binds:
        - ../routers/daemons:/etc/frr/daemons
        - ../routers/isp1/frr.conf:/etc/frr/frr.conf
      exec:
        - ip addr add 10.0.0.1/30 dev eth1
        - ip addr add 10.0.2.1/30 dev eth2
        - ip addr add 10.0.4.1/30 dev eth3
        - touch /etc/frr/vtysh.conf

    isp2:
      kind: linux
      image: quay.io/frrouting/frr:10.7.0
      binds:
        - ../routers/daemons:/etc/frr/daemons
        - ../routers/isp2/frr.conf:/etc/frr/frr.conf
      exec:
        - ip addr add 10.0.1.1/30 dev eth1
        - ip addr add 10.0.2.2/30 dev eth2
        - ip addr add 10.0.3.1/30 dev eth3
        - touch /etc/frr/vtysh.conf

    enterprise:
      kind: linux
      image: quay.io/frrouting/frr:10.7.0
      binds:
        - ../routers/daemons:/etc/frr/daemons
        - ../routers/enterprise/frr.conf:/etc/frr/frr.conf
      exec:
        - ip addr add 10.0.0.2/30 dev eth1
        - ip addr add 10.0.1.2/30 dev eth2
        - ip addr add 10.10.0.1/16 dev lo
        - ip addr add 10.10.0.254/24 dev eth3
        - touch /etc/frr/vtysh.conf

    attacker:
      kind: linux
      image: quay.io/frrouting/frr:10.7.0
      binds:
        - ../routers/daemons:/etc/frr/daemons
        - ../routers/attacker/frr.conf:/etc/frr/frr.conf
      exec:
        - ip addr add 10.0.3.2/30 dev eth1
        - touch /etc/frr/vtysh.conf

    client:
      kind: linux
      image: quay.io/frrouting/frr:10.7.0
      binds:
        - ../routers/daemons:/etc/frr/daemons
        - ../routers/client/frr.conf:/etc/frr/frr.conf
      exec:
        - ip addr add 10.0.4.2/30 dev eth1
        - ip addr add 198.51.100.1/24 dev lo
        - touch /etc/frr/vtysh.conf

    br-ent-lan:
        kind: bridge

    dhcp-server:
      kind: linux
      image: enterprise-dhcp:latest
      exec:
        - ip addr add 10.10.0.2/24 dev eth1

    client1:
      kind: linux
      image: alpine:latest
      cmd: sleep infinity

    client2:
      kind: linux
      image: alpine:latest
      cmd: sleep infinity

  links:
    - endpoints: ["isp1:eth1", "enterprise:eth1"]
    - endpoints: ["isp2:eth1", "enterprise:eth2"]
    - endpoints: ["isp1:eth2", "isp2:eth2"]
    - endpoints: ["isp2:eth3", "attacker:eth1"]
    - endpoints: ["isp1:eth3", "client:eth1"]
    - endpoints: ["enterprise:eth3", "br-ent-lan:eth1"]
    - endpoints: ["dhcp-server:eth1", "br-ent-lan:eth2"]
    - endpoints: ["client1:eth1", "br-ent-lan:eth3"]
    - endpoints: ["client2:eth1", "br-ent-lan:eth4"]
